name: Bug Report
description: File a bug report to help us improve
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: input
    id: command
    attributes:
      label: Command or Action
      description: What were you trying to do?
      placeholder: e.g., running the CI pipeline
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Description
      description: What happened?
